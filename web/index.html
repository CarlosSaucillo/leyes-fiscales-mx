<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legislación fiscal federal</title>
  <meta name="description" content="Consulta de legislación fiscal federal mexicana: LISR, CFF, LIVA, reglamentos y Ley de Ingresos.">
  <!-- Aplica el tema guardado antes de pintar la página (evita un destello blanco en modo oscuro) -->
  <script>
    (function () {
      var t = localStorage.getItem("tema");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
      document.documentElement.dataset.tema = t;
    })();
  </script>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="barra">
    <button class="boton-icono solo-movil" id="boton-menu" aria-label="Abrir índice de leyes" aria-expanded="false" aria-controls="lateral">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="marca" href="#/">
      <span class="marca-icono" aria-hidden="true">§</span>
      <span>Legislación fiscal</span>
    </a>
    <form class="busqueda-barra" id="form-busqueda" role="search">
      <label class="oculto" for="campo-busqueda">Buscar en el texto de las leyes</label>
      <svg class="lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="campo-busqueda" type="search" placeholder="Buscar en las leyes…" autocomplete="off">
    </form>
    <button class="boton-icono" id="boton-tema" aria-label="Cambiar a modo oscuro" title="Modo claro / oscuro">
      <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="cuerpo">
    <aside class="lateral" id="lateral" aria-label="Índice de leyes">
      <nav id="arbol" class="arbol"></nav>
    </aside>
    <div class="velo" id="velo" hidden></div>

    <main id="contenido" class="contenido" tabindex="-1">
      <p class="cargando">Cargando…</p>
    </main>
  </div>

  <script src="vendor/minisearch.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
