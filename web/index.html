<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Legislación fiscal · Kreston BSG</title>
  <meta name="description" content="Consulta de legislación fiscal federal mexicana: LISR, CFF, LIVA, reglamentos y Ley de Ingresos.">
  <!-- Aplica el tema guardado antes de pintar la página (evita un destello blanco en modo oscuro) -->
  <script>
    (function () {
      var t = localStorage.getItem("tema");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
      document.documentElement.dataset.tema = t;
    })();
  </script>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="barra">
    <button class="boton-icono solo-movil" id="boton-menu" aria-label="Abrir índice de leyes" aria-expanded="false" aria-controls="lateral">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="marca" href="#/">
      <span class="marca-icono" aria-hidden="true">§</span>
      <span class="marca-texto"><b>Legislación fiscal</b><small>Consulta de leyes federales</small></span>
    </a>
    <a class="logo-kreston" href="#/" aria-label="Kreston BSG · inicio">
      <svg viewBox="0 0 26 40" aria-hidden="true"><path d="M16 0h10L10 20H0z" fill="#1d9fd0" stroke="none"/><path d="M0 20h10l16 20H16z" fill="#21b3a8" stroke="none"/></svg>
      <span><b>KRESTON</b><b>BSG</b></span>
    </a>
    <form class="busqueda-barra" id="form-busqueda" role="search">
      <label class="oculto" for="campo-busqueda">Buscar en el texto de las leyes</label>
      <svg class="lupa" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="campo-busqueda" type="search" placeholder="Buscar en las leyes…" autocomplete="off">
    </form>
    <button class="boton-icono" id="boton-tema" aria-label="Cambiar a modo oscuro" title="Modo claro / oscuro">
      <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="cuerpo">
    <aside class="lateral" id="lateral" aria-label="Índice de leyes">
      <form class="ir-a" id="form-ir" autocomplete="off">
        <label class="ir-titulo" for="ir-art">Ir a artículo</label>
        <div class="ir-fila">
          <select id="ir-ley" aria-label="Ley"></select>
          <input id="ir-art" type="text" placeholder="27, 113-E…" inputmode="text">
          <button type="submit" class="boton-ir">Ir</button>
        </div>
        <p class="ir-error" id="ir-error" hidden></p>
      </form>
      <nav class="accesos" aria-label="Mis consultas">
        <a href="#/historial"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</a>
        <a href="#/notas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></svg>Mis notas</a>
        <a href="#/reformas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg>Novedades</a>
      </nav>
      <nav id="arbol" class="arbol"></nav>
    </aside>
    <div class="velo" id="velo" hidden></div>

    <div class="columna">
      <nav id="pestanas" class="pestanas" aria-label="Pestañas de consulta"></nav>
      <main id="contenido" class="contenido" tabindex="-1">
        <p class="cargando">Cargando…</p>
      </main>
    </div>
  </div>

  <dialog id="dialogo-correlacion" class="dialogo">
    <form method="dialog" id="form-correlacion">
      <h2>Sugerir correlación</h2>
      <p class="subtitulo" id="corr-origen"></p>
      <div class="campo">
        <label for="corr-ley">Ley</label>
        <select id="corr-ley"></select>
      </div>
      <div class="campo">
        <label for="corr-art">Artículo</label>
        <input id="corr-art" type="text" placeholder="27, 69-B…" required autocomplete="off">
      </div>
      <div class="campo">
        <label for="corr-nota">Comentario (opcional)</label>
        <input id="corr-nota" type="text" placeholder="Por qué se relacionan" autocomplete="off">
      </div>
      <p class="ir-error" id="corr-error" hidden></p>
      <div class="dialogo-botones">
        <button type="button" class="boton" value="cancelar" id="corr-cancelar">Cancelar</button>
        <button type="submit" class="boton primario" value="guardar">Vincular</button>
      </div>
    </form>
  </dialog>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="vendor/minisearch.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
